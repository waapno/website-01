*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Archivo,system-ui,sans-serif;color:var(--fg);background:radial-gradient(120% 80% at 50% -10%,var(--bg2),var(--bg) 60%);background-attachment:fixed;overflow-x:hidden;transition:background .5s,color .5s;-webkit-font-smoothing:antialiased}
#space{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;justify-content:space-between;gap:8px}.top>div{display:flex;gap:8px}.pill{text-decoration:none;display:inline-flex;align-items:center}
.pill{border:1px solid var(--line);background:var(--card);color:var(--fg);backdrop-filter:blur(10px);border-radius:999px;padding:8px 13px;font:700 12px Archivo;letter-spacing:.08em;cursor:pointer;transition:transform .2s var(--ease),border-color .2s}
.pill:hover{transform:translateY(-2px);border-color:var(--gold)}
header{text-align:center;margin:26px 0 22px}
.orb{position:relative;width:118px;height:118px;margin:0 auto 18px}
.orb img,.orb .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:var(--red);display:grid;place-items:center;font:44px Anton;color:var(--gold)}
.orb::before{content:"";position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(from 0deg,var(--red),var(--gold),transparent 40%,var(--red));animation:spin 6s linear infinite;mask:radial-gradient(circle,transparent 62%,#000 63%);filter:blur(1px)}
.orb::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold);top:50%;left:50%;animation:orbit 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orbit{from{transform:rotate(0) translateX(72px)}to{transform:rotate(360deg) translateX(72px)}}
h1{font:clamp(38px,9vw,56px)/.95 Anton;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--gold);text-shadow:0 0 24px rgba(255,199,44,.45)}
.tag{color:var(--mute);margin-top:10px;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font:800 11px Archivo;letter-spacing:.14em;background:var(--red);color:#fff;padding:6px 11px;border-radius:999px}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
/* Gaming / IRL switch */
.mode{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:6px;border-radius:999px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);margin:6px 0 22px}
.mode button{position:relative;z-index:1;border:0;background:none;color:var(--fg);font:22px Anton;letter-spacing:.06em;padding:12px 0;cursor:pointer;transition:color .3s}
.mode button small{display:block;font:600 10px Archivo;letter-spacing:.16em;opacity:.7}
.mode button[aria-selected=true]{color:#fff}
.mode .thumb{position:absolute;top:6px;bottom:6px;left:6px;width:calc(50% - 6px);border-radius:999px;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 8px 30px -6px var(--red),inset 0 0 0 2px rgba(255,199,44,.5);transition:transform .55s var(--ease)}
.mode[data-m=irl] .thumb{transform:translateX(100%)}
/* cards */
.list{display:grid;gap:12px;perspective:1200px}
.card{position:relative;display:block;text-decoration:none;color:inherit;border-radius:var(--r);transform-style:preserve-3d;animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
.face{position:relative;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);overflow:hidden;transition:transform .35s var(--ease),border-color .3s,box-shadow .3s}
.face::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,199,44,.18),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover .face{border-color:var(--gold);box-shadow:0 18px 40px -18px var(--red)}
.card:hover .face::before{opacity:1}
.card.feat .face{background:linear-gradient(135deg,rgba(218,41,28,.92),rgba(150,12,6,.92));border-color:rgba(255,199,44,.55);color:#fff}
.card.feat .sub,.card.feat .meta{color:rgba(255,240,220,.85)}
.ico{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--gold);color:var(--red2)}
.ico svg{width:28px;height:28px}
.nm{font:22px/1 Anton;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hd{font:600 12px Archivo;opacity:.75;text-transform:none;letter-spacing:0}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;color:var(--mute)}
.meta span{font:700 10px Archivo;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor;opacity:.8}
.go{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--red2);transition:transform .3s var(--ease)}
.card:hover .go{transform:translateX(3px) rotate(-45deg)}
.live{font:800 9px Archivo;letter-spacing:.14em;background:var(--gold);color:var(--red2);padding:3px 7px;border-radius:6px}
/* IRL portal chip — appears on any card that has an irl object */
.portal{position:absolute;right:58px;top:10px;z-index:3;display:flex;align-items:center;gap:5px;border:1px dashed var(--gold);background:rgba(0,0,0,.25);color:var(--gold);border-radius:999px;padding:4px 9px;font:800 10px Archivo;letter-spacing:.12em;cursor:pointer;transition:all .25s}
.portal:hover{background:var(--gold);color:var(--red2);border-style:solid}
.portal i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.card.flip .face{animation:warp .6s var(--ease)}
@keyframes warp{40%{transform:rotateX(90deg) scale(.96);filter:blur(2px) brightness(1.6)}}
.sec{font:16px Anton;letter-spacing:.14em;color:var(--gold);margin:22px 4px 10px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
footer{text-align:center;margin-top:34px;color:var(--mute);font-size:12px;letter-spacing:.08em}
footer a{color:var(--gold);text-decoration:none}
.warpflash{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle,rgba(255,199,44,.35),transparent 60%);opacity:0}
.warpflash.on{animation:flash .7s ease}
@keyframes flash{30%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* Interstellar starfield — warps on mode switch, follows pointer */
var cv=$("#space"),cx=cv.getContext("2d"),W,H,stars=[],speed=1,mx=0,my=0,
 reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;}
size();addEventListener("resize",size);
for(var k=0;k<260;k++)stars.push({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()});
addEventListener("pointermove",function(e){mx=(e.clientX/innerWidth-.5)*.3;my=(e.clientY/innerHeight-.5)*.3;});
(function loop(){
 var col=getComputedStyle(document.documentElement).getPropertyValue("--star")||"255,240,210";
 cx.clearRect(0,0,W,H);speed+=(1-speed)*.04;
 for(var s of stars){var pz=s.z;s.z-=.0025*speed*(reduce?0:1);if(s.z<=.01){s.z=1;s.x=Math.random()*2-1;s.y=Math.random()*2-1;pz=1;}
  var sx=(s.x/s.z+mx)*W/2+W/2,sy=(s.y/s.z+my)*H/2+H/2,ox=(s.x/pz+mx)*W/2+W/2,oy=(s.y/pz+my)*H/2+H/2,a=1-s.z;
  cx.strokeStyle="rgba("+col+","+a+")";cx.lineWidth=a*2.2*devicePixelRatio;cx.beginPath();cx.moveTo(ox,oy);cx.lineTo(sx,sy);cx.stroke();}
 requestAnimationFrame(loop);
})();
})();
