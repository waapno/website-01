<style>
  :root{
    --red:#E0102B;
    --red-deep:#9E0C20;
    --gold:#FFC629;
    --ink:#141110;
    --card:#1E1A18;
    --paper:#FFFAF2;
    --mute:#B9AFA7;
    --line:rgba(255,255,255,.12);
    --shadow-gold:0 0 24px 2px rgba(255,198,41,.40);
    --shadow-red:0 12px 30px rgba(224,16,43,.40);
    --radius:16px;
  }
  :root { --foreground:var(--paper); --secondary:#2a2422; --on-red:#FFFAF2; --on-gold:#141110; --star:var(--paper); }
  :root[data-theme="light"] { --ink:#fafafa; --card:#ffffff; --foreground:#272323; --mute:#625b58; --gold:#93600d; --line:rgba(39,35,35,.18); --secondary:#efeded; --star:#b69b66; --shadow-gold:0 0 16px rgba(147,96,13,.15); }
  *{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--foreground);
    background:
      radial-gradient(700px 480px at 50% -10%, rgba(224,16,43,.45), transparent 65%),
      radial-gradient(520px 360px at 85% 30%, rgba(255,198,41,.12), transparent 70%),
      radial-gradient(600px 420px at 10% 80%, rgba(158,12,32,.40), transparent 70%),
      var(--ink);
    background-attachment:fixed;
    padding:56px 20px 32px;
  }
  a{color:inherit;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px;}
  .display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.04em;}

  /* ---------- starfield ---------- */
  .sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;transition:transform .3s ease;}
  .star{position:absolute;border-radius:9999px;background:var(--star);animation:twinkle var(--d,3s) ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8);}50%{opacity:1;transform:scale(1.2);}}

  /* ---------- layout ---------- */
  .wrap{position:relative;max-width:448px;margin:0 auto;display:flex;flex-direction:column;align-items:center;}
  .back{
    position:fixed;top:16px;left:16px;z-index:10;
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 16px;border-radius:999px;text-decoration:none;
    font-size:.875rem;font-weight:600;
    color:var(--foreground);background:var(--card);border:1px solid var(--line);
    backdrop-filter:blur(6px);transition:transform .15s ease,background .15s ease;
  }
  .back:hover{background:var(--secondary);transform:translateY(-2px);}

  /* ---------- avatar + orbiting ring ---------- */
  .orb{position:relative;width:128px;height:128px;margin-bottom:12px;}
  .ring{
    position:absolute;inset:-12px;border-radius:9999px;
    border:2px dashed rgba(255,198,41,.6);
    animation:orbit 18s linear infinite;
  }
  .ring::after{
    content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;
    margin-left:-6px;border-radius:9999px;background:var(--gold);
    box-shadow:var(--shadow-gold);
  }
  @keyframes orbit{to{transform:rotate(360deg);}}
  .orb img{
    width:100%;height:100%;border-radius:9999px;object-fit:cover;
    border:4px solid var(--gold);box-shadow:var(--shadow-red);
    background:var(--card);
  }

  h1{
    margin:0;font-family:'Anton',sans-serif;font-weight:400;
    font-size:3rem;letter-spacing:.04em;text-align:center;
    background:linear-gradient(180deg,var(--gold),rgba(255,198,41,.62));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .handle{margin:0;color:var(--gold);font-weight:700;font-size:1rem;}
  .tagline{margin:2px 0 10px;color:var(--mute);font-size:.9rem;text-align:center;}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
  .chip{padding:4px 12px;border-radius:999px;}
  .chip-red{background:var(--red);color:var(--on-red);}
  .chip-gold{background:var(--gold);color:var(--on-gold);}

  /* ---------- featured cards ---------- */
  .list{display:flex;flex-direction:column;gap:16px;width:100%;}
  .card{
    width:100%;border:2px solid var(--gold);border-radius:var(--radius);
    background:var(--card);padding:16px;
    box-shadow:var(--shadow-gold);animation:glow 2.8s ease-in-out infinite;
    transition:transform .2s ease;transform-style:preserve-3d;
  }
  @keyframes glow{
    0%,100%{box-shadow:0 0 10px 0 rgba(255,198,41,.15);}
    50%{box-shadow:0 0 24px 4px rgba(255,198,41,.45);}
  }
  .row{display:flex;align-items:center;gap:12px;}
  .main{flex:1;min-width:0;display:flex;align-items:center;gap:16px;text-decoration:none;font-weight:800;}
  .badge{
    flex:0 0 auto;width:48px;height:48px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:var(--red);color:var(--on-red);box-shadow:var(--shadow-red);
  }
  .badge svg{width:24px;height:24px;}
  .title{display:flex;align-items:center;gap:8px;font-size:1.125rem;}
  .live{
    display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
    background:var(--red);font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  }
  .live i{width:6px;height:6px;border-radius:9999px;background:var(--paper);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  .sub{display:block;margin-top:2px;font-size:.75rem;font-weight:500;color:var(--mute);}
  .sub b{color:var(--gold);font-weight:600;}
  .info{
    flex:0 0 auto;width:36px;height:36px;border-radius:9999px;border:0;cursor:pointer;
    background:var(--secondary);color:var(--gold);font-family:'Anton',sans-serif;font-size:1.1rem;
    display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;
  }
  .info:hover{background:var(--gold);color:var(--on-gold);}

  /* ---------- detail panel ---------- */
  .panel{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);text-align:left;font-size:.875rem;animation:fade .25s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .panel p{margin:0 0 10px;color:var(--mute);}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;}
  .stat{background:var(--secondary);border-radius:10px;padding:6px 8px;}
  .stat dt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);}
  .stat dd{margin:2px 0 0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;}
  .tag{background:var(--red);color:var(--on-red);border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700;}
  .copy{
    margin-left:auto;background:transparent;border:1px solid var(--gold);color:var(--gold);
    border-radius:999px;padding:2px 12px;font-size:.75rem;font-weight:700;cursor:pointer;
    font-family:inherit;transition:background .15s ease,color .15s ease;
  }
  .copy:hover{background:var(--gold);color:var(--on-gold);}

  /* ---------- small icons ---------- */
  .icons{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:28px;}
  .ico{
    width:56px;height:56px;border-radius:9999px;background:var(--red);color:var(--on-red);
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.35);
    transition:transform .15s ease,background .15s ease,box-shadow .15s ease;
  }
  .ico svg{width:24px;height:24px;}
  .ico:hover{transform:translateY(-4px);background:var(--red-deep);}
  .ico.on{box-shadow:0 0 0 2px var(--gold);}

  .peek{
    margin-top:16px;width:100%;min-height:112px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--card);padding:16px;font-size:.875rem;
    backdrop-filter:blur(6px);
  }
  .peek .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .peek .name{font-family:'Anton',sans-serif;font-size:1.25rem;letter-spacing:.03em;}
  .peek .h{font-size:.75rem;font-weight:700;color:var(--gold);}
  .peek .empty{padding-top:24px;text-align:center;color:var(--mute);}

  footer{margin-top:40px;text-align:center;font-size:.75rem;color:var(--mute);}
  footer a{color:var(--gold);font-weight:700;text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  @media (prefers-reduced-motion: reduce){
    .star,.card,.ring{animation:none !important;}
    .sky{transition:none;}
    .card{transform:none !important;}
  }
  .settings{position:fixed;top:16px;right:16px;z-index:20;display:flex;gap:8px;}
  .setting{height:36px;min-width:36px;padding:0 10px;background:var(--card);color:var(--foreground);border:1px solid var(--line);border-radius:6px;font:600 12px 'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .setting svg{width:18px;height:18px;}
  .card{position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,198,41,.16) 48%,transparent 60%);transform:translateX(-130%);animation:scanline 7s ease-in-out infinite;}
  @keyframes scanline{0%,55%{transform:translateX(-130%);}80%,100%{transform:translateX(130%);}}
  .comet{position:fixed;right:-80px;top:-80px;width:2px;height:90px;border-radius:999px;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:0;transform:rotate(35deg);animation:comet 9s linear infinite;pointer-events:none;z-index:1;}
  @keyframes comet{0%,78%{opacity:0;translate:110vw -10vh;}82%{opacity:1;}92%,100%{opacity:0;translate:-20vw 100vh;}}
  .irl{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:6px 12px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);background:transparent;font-size:.75rem;font-weight:700;text-decoration:none;transition:transform .15s ease,background .15s ease,color .15s ease;}
  .irl i{width:6px;height:6px;border-radius:999px;background:currentColor;box-shadow:0 0 10px currentColor;}
  .irl:hover{transform:translateY(-2px);background:var(--gold);color:var(--on-gold);}
  .irl span{transition:transform .15s ease;}
  .irl:hover span{transform:translateX(2px);}
  @media (prefers-reduced-motion: reduce){.card::before,.comet{animation:none !important;}}
  .live{color:var(--on-red);}
  @media(max-width:480px){h1{font-size:2.1rem;}body{padding-top:76px;}.stats{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);}.stat dd{white-space:normal;overflow-wrap:anywhere;}.main{gap:10px;}.row{gap:8px;}}
</style>

for(var i=0;i<90;i++){var star=document.createElement('span');star.className='star';star.style.cssText='left:'+((i*37.7)%100)+'%;top:'+((i*53.3)%100)+'%;width:'+((i%3)+1)+'px;height:'+((i%3)+1)+'px;--d:'+(2+(i%5))+'s;animation-delay:'+((i%7)*.4)+'s';sky.appendChild(star);}
if(!reduce)window.addEventListener('pointermove',function(e){sky.style.transform='translate('+((e.clientX/window.innerWidth-.5)*-18)+'px,'+((e.clientY/window.innerHeight-.5)*-18)+'px)';});
function currentLinks(){return LINKS.map(function(l){return language==='en'?Object.assign({},l,EN_LINKS[l.id]):l;});}
function panel(l){var t=UI[language];var extra=l.irl?'<a class="irl" href="'+esc(l.irl.url)+'" target="_blank" rel="noopener noreferrer"><i></i>'+esc(l.irl.name+' · '+l.irl.handle)+' <span>↗</span></a>':'';return '<div class="panel"><p>'+esc(l.about)+'</p><dl class="stats">'+[[t.type,l.type],[t.frequency,l.cadence],[t.domain,new URL(l.url).hostname.replace(/^www\./,'')]].map(function(x){return '<div class="stat"><dt>'+esc(x[0])+'</dt><dd title="'+esc(x[1])+'">'+esc(x[1])+'</dd></div>';}).join('')+'</dl><div class="tags">'+l.tags.map(function(t){return '<span class="tag">#'+esc(t)+'</span>';}).join('')+'<button type="button" class="copy" data-copy="'+esc(l.url)+'">'+esc(t.copy)+'</button></div>'+extra+'</div>';}
function showPeek(){var l=currentLinks().find(function(x){return x.id===active;});peek.innerHTML=l?'<div class="head"><span class="name">'+esc(l.name)+'</span><span class="h">'+esc(l.handle)+'</span></div>'+panel(l):'<p class="empty">'+esc(UI[language].empty)+'</p>';Array.from(icons.children).forEach(function(a){a.classList.toggle('on',a.dataset.id===active);});}
function render(){var t=UI[language],links=currentLinks();document.documentElement.lang=language;document.documentElement.dataset.theme=theme;document.querySelector('.tagline').textContent=t.tagline;document.getElementById('count').textContent=links.length+' '+t.links;
var lb=document.getElementById('language');lb.textContent=language==='en'?'CZ':'ENG';lb.setAttribute('aria-label',language==='en'?'Switch to Czech':'Přepnout na angličtinu');lb.title=language==='en'?'Čeština':'English';
var tb=document.getElementById('theme');tb.setAttribute('aria-label',theme==='dark'?t.light:t.dark);tb.title=theme==='dark'?t.light:t.dark;tb.innerHTML=theme==='dark'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 15.4A9 9 0 018.6 4 9 9 0 1020 15.4z"/></svg>';
feat.innerHTML=links.filter(function(l){return l.featured;}).map(function(l){var open=openPanels.has(l.id);return '<div class="card" data-tilt><div class="row"><a class="main" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer"><span class="badge">'+l.icon+'</span><span style="min-width:0"><span class="title">'+esc(l.name)+(l.live?'<span class="live"><i></i> Live</span>':'')+'</span><span class="sub">'+esc(l.sub)+' &middot; <b>'+esc(l.handle)+'</b></span>'+(l.irl?'<span class="sub" style="color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.08em">'+esc(t.irl)+'</span>':'')+'</span></a><button class="info" type="button" aria-expanded="'+open+'" aria-label="'+esc(t.details+' '+l.name)+'" title="'+esc(t.details+' '+l.name)+'" data-toggle="'+l.id+'">'+(open?'−':'i')+'</button></div><div id="panel-'+l.id+'"'+(open?'':' hidden')+'>'+panel(l)+'</div></div>';}).join('');
icons.innerHTML=links.filter(function(l){return !l.featured;}).map(function(l){return '<a class="ico" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(l.name)+'" data-id="'+l.id+'">'+l.icon+'</a>';}).join('');showPeek();
if(!reduce)document.querySelectorAll('[data-tilt]').forEach(function(card){card.addEventListener('mousemove',function(e){var r=card.getBoundingClientRect();card.style.transform='perspective(700px) rotateX('+(-(e.clientY-r.top)/r.height+.5)*6+'deg) rotateY('+((e.clientX-r.left)/r.width-.5)*8+'deg)';});card.addEventListener('mouseleave',function(){card.style.transform='';});});
}
document.getElementById('language').addEventListener('click',function(){language=language==='en'?'cs':'en';try{localStorage.setItem('sip-language',language);}catch(e){}render();});
document.getElementById('theme').addEventListener('click',function(){theme=theme==='dark'?'light':'dark';try{localStorage.setItem('sip-theme',theme);}catch(e){}render();});
feat.addEventListener('click',function(e){var b=e.target.closest('[data-toggle]');if(!b)return;var id=b.dataset.toggle;if(openPanels.has(id))openPanels.delete(id);else openPanels.add(id);var open=openPanels.has(id);document.getElementById('panel-'+id).hidden=!open;b.setAttribute('aria-expanded',String(open));b.textContent=open?'−':'i';});
function selectIcon(e){var a=e.target.closest('[data-id]');if(a){active=a.dataset.id;showPeek();}}
icons.addEventListener('mouseover',selectIcon);icons.addEventListener('focusin',selectIcon);
document.addEventListener('click',async function(e){var b=e.target.closest('[data-copy]');if(!b)return;try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent=UI[language].copied;setTimeout(function(){b.textContent=UI[language].copy;},1400);}catch(err){b.textContent=language==='en'?'Copy unavailable':'Kopírování není dostupné';}});
render();
})();
</script>
</body>
</html>
