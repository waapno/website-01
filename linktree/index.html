<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E0102B">
<title>Sip of Cola TV — Links</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23E0102B'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%23FFC629'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* Same design tokens as the stream page, for a consistent brand */
  :root{
    --red:#E0102B;
    --red-dk:#9E0C20;
    --gold:#FFC629;
    --ink:#141110;
    --ink-2:#1E1A18;
    --paper:#FFFAF2;
    --mute:#B9AFA7;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(600px 420px at 50% -10%, rgba(224,16,43,.35), transparent 65%),
      radial-gradient(500px 340px at 50% 8%, rgba(255,198,41,.12), transparent 70%),
      var(--ink);
    color:var(--paper);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(28px,6vw,60px) 20px 30px;
  }
  h1{font-family:'Anton',sans-serif;font-weight:400;margin:0;letter-spacing:.5px;}
  a{color:inherit;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

  .back-btn{
    position:fixed;
    top:16px;left:16px;
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(0,0,0,.35);
    color:var(--paper);
    text-decoration:none;
    border:1px solid rgba(255,255,255,.25);
    border-radius:999px;
    padding:7px 14px;
    font-size:.82rem;
    font-weight:600;
    backdrop-filter:blur(4px);
    transition:background .15s ease, transform .15s ease;
    z-index:10;
  }
  .back-btn:hover{background:rgba(0,0,0,.5);transform:translateY(-1px);}

  .card{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    margin-top:20px;
  }

  .avatar{
    width:104px;height:104px;
    border-radius:50%;
    background:linear-gradient(160deg,var(--red),var(--red-dk));
    border:3px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Anton',sans-serif;
    font-size:2.2rem;
    color:var(--paper);
    box-shadow:0 12px 30px rgba(224,16,43,.35);
    margin-bottom:6px;
  }
  .avatar img{
    width:100%;height:100%;
    border-radius:50%;
    object-fit:cover;
  }
  .name{font-size:clamp(1.7rem,6vw,2.3rem);text-align:center;}
  .handle{
    margin:0;color:var(--gold);font-weight:700;font-size:.95rem;
    letter-spacing:.3px;
  }
  .tagline{
    margin:2px 0 22px;color:var(--mute);font-size:.92rem;text-align:center;max-width:320px;
  }

  /* ---------- FEATURED LINKS ---------- */
  .featured{
    display:flex;flex-direction:column;gap:14px;
    width:100%;
  }
  .feat-btn{
    position:relative;
    display:flex;align-items:center;gap:14px;
    width:100%;
    padding:16px 20px;
    background:var(--ink-2);
    border:2px solid var(--gold);
    border-radius:16px;
    text-decoration:none;
    color:var(--paper);
    font-weight:800;
    font-size:1.05rem;
    box-shadow:0 0 0 rgba(255,198,41,.0);
    animation:glow 2.8s ease-in-out infinite;
    transition:transform .15s ease, background .15s ease;
  }
  .feat-btn:hover{transform:translateY(-2px) scale(1.01);background:#2A2320;}
  .feat-btn:active{transform:translateY(0) scale(1);}
  .feat-btn svg{width:28px;height:28px;flex:0 0 auto;}
  .feat-btn .sub{
    display:block;font-family:'Inter',sans-serif;font-weight:500;
    font-size:.78rem;color:var(--mute);margin-top:2px;
  }
  @keyframes glow{
    0%,100%{box-shadow:0 0 10px 0 rgba(255,198,41,.15);}
    50%{box-shadow:0 0 22px 4px rgba(255,198,41,.4);}
  }

  /* ---------- SECONDARY ICONS ---------- */
  .icon-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:16px;
    margin-top:26px;
  }
  .icon-btn{
    width:54px;height:54px;
    border-radius:50%;
    background:var(--red);
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow:0 4px 14px rgba(0,0,0,.3);
  }
  .icon-btn svg{width:24px;height:24px;color:var(--paper);}
  .icon-btn:hover{transform:translateY(-3px);background:var(--red-dk);box-shadow:0 8px 18px rgba(0,0,0,.4);}

  footer{
    margin-top:40px;
    color:var(--mute);
    font-size:.8rem;
    text-align:center;
  }
  footer a{color:var(--gold);text-decoration:none;font-weight:700;}
  footer a:hover{text-decoration:underline;}

  @media (prefers-reduced-motion:reduce){
    .feat-btn{animation:none;}
  }
</style>
</head>
<body>

<a class="back-btn" id="backBtn" href="#">← Server</a>

<div class="card">
  <div class="avatar" id="avatar"><img src="zlaticon.webp" alt="Sip of Cola TV avatar"></div>
  <h1 class="name" id="displayName">Sip of Cola TV</h1>
  <p class="handle" id="handle">aka Zlators</p>
  <p class="tagline" id="tagline">Live streams, clips &amp; community</p>

  <!-- ===== FEATURED (highlighted / glowing) ===== -->
  <div class="featured">
    <a class="feat-btn" id="link-youtube" href="https://youtube.com/@SipColaTV" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2.5" y="5.5" width="19" height="13" rx="4" stroke="currentColor" stroke-width="1.6"/>
        <path d="M10.5 9.5L15 12l-4.5 2.5v-5z" fill="currentColor"/>
      </svg>
      <span>YouTube<span class="sub">Watch full VODs &amp; highlights</span></span>
    </a>
    <a class="feat-btn" id="link-kick" href="https://kick.com/zlatorsipofcola" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="2" fill="currentColor"/>
        <path d="M12 5.5v0M12 18.5v0M5.5 12h0M18.5 12h0M7.5 7.5v0M16.5 16.5v0M16.5 7.5v0M7.5 16.5v0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M12 8a4 4 0 100 8 4 4 0 000-8z" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <span>Kick<span class="sub">Live now — join the stream</span></span>
    </a>
    <a class="feat-btn" id="link-x" href="https://x.com/your_handle" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
      </svg>
      <span>X (Twitter)<span class="sub">Announcements &amp; clips</span></span>
    </a>
  </div>

  <!-- ===== SECONDARY (small icons) ===== -->
  <div class="icon-row">
    <a class="icon-btn" id="link-instagram" href="https://instagram.com/your_handle" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" rx="5" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="16.6" cy="7.4" r="1.1" fill="currentColor"/>
      </svg>
    </a>
    <a class="icon-btn" id="link-facebook" href="https://facebook.com/your_page" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M14.5 8.5h2V5.5h-2.3C12.2 5.5 11 6.9 11 8.9v2.1H9v3h2V19h3v-5h2.2l.5-3H14v-1.6c0-.6.3-.9.9-.9z" fill="currentColor"/>
      </svg>
    </a>
    <a class="icon-btn" id="link-twitch" href="https://twitch.tv/your_channel" target="_blank" rel="noopener noreferrer" aria-label="Twitch">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M5 4.5h14v9l-3.5 3.5H12l-2.5 2.5H9v-2.5H5v-12.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12.5 8v3.2M16 8v3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </a>
    <a class="icon-btn" id="link-tiktok" href="https://tiktok.com/@your_handle" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M13 4v10.2a2.6 2.6 0 11-2.4-2.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M13 4c.4 2.2 2 3.7 4.2 4v2.4c-1.6 0-3-.5-4.2-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </a>
  </div>

  <footer>Part of SIP'S NETWORK — <a id="footerLink" href="https://siphcf.eu">siphcf.eu</a></footer>
</div>

<script>
(function(){
  "use strict";
  /* ================= CONFIG — EDIT THIS ================= */
  const CONFIG = {
    displayName: "Sip of Cola TV",
    handle: "aka Zlators",
    tagline: "Live streams, clips & community",
    avatarInitials: "SC",
    serverHomeUrl: "https://siphcf.eu",
    links: {
      youtube: "https://youtube.com/@SipColaTV",
      kick: "https://kick.com/zlatorsipofcola",
      x: "https://x.com/your_handle",
      instagram: "https://instagram.com/your_handle",
      facebook: "https://facebook.com/your_page",
      twitch: "https://twitch.tv/your_channel",
      tiktok: "https://tiktok.com/@your_handle"
    }
  };
  /* ========================================================= */
  const $ = (id) => document.getElementById(id);
  document.title = CONFIG.displayName + " — Links";
  $("displayName").textContent = CONFIG.displayName;
  $("handle").textContent = CONFIG.handle;
  $("tagline").textContent = CONFIG.tagline;
  $("backBtn").href = CONFIG.serverHomeUrl;
  $("footerLink").href = CONFIG.serverHomeUrl;

  $("link-youtube").href = CONFIG.links.youtube;
  $("link-kick").href = CONFIG.links.kick;
  $("link-x").href = CONFIG.links.x;
  $("link-instagram").href = CONFIG.links.instagram;
  $("link-facebook").href = CONFIG.links.facebook;
  $("link-twitch").href = CONFIG.links.twitch;
  $("link-tiktok").href = CONFIG.links.tiktok;
})();
</script>
</body>
</html>
