<style>
  :root{
    --red:#E0102B;
    --red-deep:#9E0C20;
    --gold:#FFC629;
    --ink:#141110;
    --card:#1E1A18;
    --paper:#FFFAF2;
    --mute:#B9AFA7;
    --line:rgba(255,255,255,.12);
    --shadow-gold:0 0 24px 2px rgba(255,198,41,.40);
    --shadow-red:0 12px 30px rgba(224,16,43,.40);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--paper);
    background:
      radial-gradient(700px 480px at 50% -10%, rgba(224,16,43,.45), transparent 65%),
      radial-gradient(520px 360px at 85% 30%, rgba(255,198,41,.12), transparent 70%),
      radial-gradient(600px 420px at 10% 80%, rgba(158,12,32,.40), transparent 70%),
      var(--ink);
    background-attachment:fixed;
    padding:56px 20px 32px;
  }
  a{color:inherit;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px;}
  .display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.04em;}

  /* ---------- starfield ---------- */
  .sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;transition:transform .3s ease;}
  .star{position:absolute;border-radius:9999px;background:var(--paper);animation:twinkle var(--d,3s) ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8);}50%{opacity:1;transform:scale(1.2);}}

  /* ---------- layout ---------- */
  .wrap{position:relative;max-width:448px;margin:0 auto;display:flex;flex-direction:column;align-items:center;}
  .back{
    position:fixed;top:16px;left:16px;z-index:10;
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 16px;border-radius:999px;text-decoration:none;
    font-size:.875rem;font-weight:600;
    color:var(--paper);background:rgba(20,17,16,.6);border:1px solid var(--line);
    backdrop-filter:blur(6px);transition:transform .15s ease,background .15s ease;
  }
  .back:hover{background:rgba(20,17,16,.85);transform:translateY(-2px);}

  /* ---------- avatar + orbiting ring ---------- */
  .orb{position:relative;width:128px;height:128px;margin-bottom:12px;}
  .ring{
    position:absolute;inset:-12px;border-radius:9999px;
    border:2px dashed rgba(255,198,41,.6);
    animation:orbit 18s linear infinite;
  }
  .ring::after{
    content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;
    margin-left:-6px;border-radius:9999px;background:var(--gold);
    box-shadow:var(--shadow-gold);
  }
  @keyframes orbit{to{transform:rotate(360deg);}}
  .orb img{
    width:100%;height:100%;border-radius:9999px;object-fit:cover;
    border:4px solid var(--gold);box-shadow:var(--shadow-red);
    background:var(--card);
  }

  h1{
    margin:0;font-family:'Anton',sans-serif;font-weight:400;
    font-size:clamp(2.1rem,9vw,3rem);letter-spacing:.04em;text-align:center;
    background:linear-gradient(180deg,var(--gold),rgba(255,198,41,.62));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .handle{margin:0;color:var(--gold);font-weight:700;font-size:1rem;}
  .tagline{margin:2px 0 10px;color:var(--mute);font-size:.9rem;text-align:center;}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
  .chip{padding:4px 12px;border-radius:999px;}
  .chip-red{background:var(--red);color:var(--paper);}
  .chip-gold{background:var(--gold);color:var(--ink);}

  /* ---------- featured cards ---------- */
  .list{display:flex;flex-direction:column;gap:16px;width:100%;}
  .card{
    width:100%;border:2px solid var(--gold);border-radius:var(--radius);
    background:var(--card);padding:16px;
    box-shadow:var(--shadow-gold);animation:glow 2.8s ease-in-out infinite;
    transition:transform .2s ease;transform-style:preserve-3d;
  }
  @keyframes glow{
    0%,100%{box-shadow:0 0 10px 0 rgba(255,198,41,.15);}
    50%{box-shadow:0 0 24px 4px rgba(255,198,41,.45);}
  }
  .row{display:flex;align-items:center;gap:12px;}
  .main{flex:1;min-width:0;display:flex;align-items:center;gap:16px;text-decoration:none;font-weight:800;}
  .badge{
    flex:0 0 auto;width:48px;height:48px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:var(--red);color:var(--paper);box-shadow:var(--shadow-red);
  }
  .badge svg{width:24px;height:24px;}
  .title{display:flex;align-items:center;gap:8px;font-size:1.125rem;}
  .live{
    display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
    background:var(--red);font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  }
  .live i{width:6px;height:6px;border-radius:9999px;background:var(--paper);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  .sub{display:block;margin-top:2px;font-size:.75rem;font-weight:500;color:var(--mute);}
  .sub b{color:var(--gold);font-weight:600;}
  .info{
    flex:0 0 auto;width:36px;height:36px;border-radius:9999px;border:0;cursor:pointer;
    background:#2a2422;color:var(--gold);font-family:'Anton',sans-serif;font-size:1.1rem;
    display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;
  }
  .info:hover{background:var(--gold);color:var(--ink);}

  /* ---------- detail panel ---------- */
  .panel{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);text-align:left;font-size:.875rem;animation:fade .25s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .panel p{margin:0 0 10px;color:var(--mute);}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;}
  .stat{background:#2a2422;border-radius:10px;padding:6px 8px;}
  .stat dt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);}
  .stat dd{margin:2px 0 0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;}
  .tag{background:var(--red);color:var(--paper);border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700;}
  .copy{
    margin-left:auto;background:transparent;border:1px solid var(--gold);color:var(--gold);
    border-radius:999px;padding:2px 12px;font-size:.75rem;font-weight:700;cursor:pointer;
    font-family:inherit;transition:background .15s ease,color .15s ease;
  }
  .copy:hover{background:var(--gold);color:var(--ink);}

  /* ---------- small icons ---------- */
  .icons{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:28px;}
  .ico{
    width:56px;height:56px;border-radius:9999px;background:var(--red);color:var(--paper);
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.35);
    transition:transform .15s ease,background .15s ease,box-shadow .15s ease;
  }
  .ico svg{width:24px;height:24px;}
  .ico:hover{transform:translateY(-4px);background:var(--red-deep);}
  .ico.on{box-shadow:0 0 0 2px var(--gold);}

  .peek{
    margin-top:16px;width:100%;min-height:112px;border:1px solid var(--line);
    border-radius:var(--radius);background:rgba(30,26,24,.72);padding:16px;font-size:.875rem;
    backdrop-filter:blur(6px);
  }
  .peek .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .peek .name{font-family:'Anton',sans-serif;font-size:1.25rem;letter-spacing:.03em;}
  .peek .h{font-size:.75rem;font-weight:700;color:var(--gold);}
  .peek .empty{padding-top:24px;text-align:center;color:var(--mute);}

  footer{margin-top:40px;text-align:center;font-size:.75rem;color:var(--mute);}
  footer a{color:var(--gold);font-weight:700;text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  @media (prefers-reduced-motion: reduce){
    .star,.card,.ring{animation:none !important;}
    .sky{transition:none;}
    .card{transform:none !important;}
  }
</style>
</head>

    <span class="chip chip-gold">I'm streamin' it</span>
  </div>

  <div class="list" id="featured"></div>

  <div class="icons" id="icons"></div>

  <div class="peek" id="peek">
    <p class="empty">Najeď na ikonu pro detaily odkazu &#10022;</p>
  </div>

  <footer>
    Part of SIP'S NETWORK &mdash; <a href="https://siphcf.eu">siphcf.eu</a>
  </footer>
</main>

<script>
(function(){
  "use strict";

  /* ============ CONFIG — tady měň odkazy a texty ============ */
  var LINKS = [
    {
      id:"youtube", name:"YouTube", url:"https://youtube.com/@SipColaTV", handle:"@SipColaTV",
      sub:"Celé VODky & highlighty", about:"Archiv streamů, sestřihy nejlepších momentů a delší videa.",
      type:"Video", cadence:"Týdně", tags:["VOD","Highlights","Shorts"], featured:true,
      icon:'<svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5.5" width="19" height="13" rx="4" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 9.5L15 12l-4.5 2.5v-5z" fill="currentColor"/></svg>'
    },
    {
      id:"kick", name:"Kick", url:"https://kick.com/sipofcolairl", handle:"sipofcolairl",
      sub:"Live — připoj se na stream", about:"Hlavní streamovací kanál. Chat, quests a komunita v reálném čase.",
      type:"Live stream", cadence:"Několikrát týdně", tags:["Live","Chat","Gaming"], featured:true, live:true,
      icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M6 4h4v5l4-5h4l-5 7 5 9h-4l-4-6v6H6z" fill="currentColor"/></svg>'
    },
    {
      id:"x", name:"X / Twitter", url:"https://x.com/sipofcolairl", handle:"@sipofcolairl",
      sub:"Oznámení & klipy", about:"Kdy jde stream live, rychlé klipy a novinky ze SIP'S NETWORK.",
      type:"Sociální síť", cadence:"Denně", tags:["Novinky","Klipy"], featured:true,
      icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>'
    },
    {
      id:"instagram", name:"Instagram", url:"https://www.instagram.com/sipofcolairl/", handle:"@sipofcolairl",
      sub:"Fotky & stories", about:"Zákulisí, stories a vizuální momenty.",
      type:"Sociální síť", cadence:"Průběžně", tags:["Stories","Reels"],
      icon:'<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="5" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.7"/><circle cx="16.6" cy="7.4" r="1.1" fill="currentColor"/></svg>'
    },
    {
      id:"discord", name:"Discord", url:"https://discord.gg/EQNjkvTpPs", handle:"Pozvánka",
      sub:"Komunitní server", about:"Pokec s komunitou, oznámení streamů a společné hraní.",
      type:"Komunita", cadence:"24/7", tags:["Chat","Voice","Events"],
      icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M8.2 7.2a13 13 0 017.6 0l1.5 1.2 1.2 8.2a12 12 0 01-3.7 1.9l-.8-1.3a8 8 0 01-4 0l-.8 1.3a12 12 0 01-3.7-1.9l1.2-8.2 1.5-1.2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9.5" cy="12.2" r="1" fill="currentColor"/><circle cx="14.5" cy="12.2" r="1" fill="currentColor"/></svg>'
    },
    {
      id:"club", name:"Club", url:"https://club.com/sipofcolairl", handle:"sipofcolairl",
      sub:"Klubový obsah", about:"Exkluzivní obsah pro členy klubu.",
      type:"Membership", cadence:"Průběžně", tags:["Exkluzivní"],
      icon:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M15.5 8.5a4.5 4.5 0 100 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
    },
    {
      id:"tiktok", name:"TikTok", url:"https://www.tiktok.com/@sipofcolairl", handle:"@sipofcolairl",
      sub:"Krátké klipy", about:"Nejvtipnější momenty ze streamů v krátkém formátu.",
      type:"Krátká videa", cadence:"Několikrát týdně", tags:["Shorts","Memes"],
      icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M13 4v10.2a2.6 2.6 0 11-2.4-2.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M13 4c.4 2.2 2 3.7 4.2 4v2.4c-1.6 0-3-.5-4.2-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'
    }
  ];
  /* ========================================================= */

  var esc = function(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  };
  var domain = function(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return u; } };

  /* ---- hvězdné pozadí ---- */
  var sky = document.getElementById("sky");
  var html = "";
  for (var i=0;i<90;i++){
    html += '<span class="star" style="left:'+((i*37.7)%100)+'%;top:'+((i*53.3)%100)+'%;width:'+((i%3)+1)+'px;height:'+((i%3)+1)+'px;--d:'+(2+(i%5))+'s;animation-delay:'+((i%7)*0.4)+'s"></span>';
  }
  sky.innerHTML = html;

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce){
    window.addEventListener("pointermove", function(e){
      var x = e.clientX / window.innerWidth - 0.5;
      var y = e.clientY / window.innerHeight - 0.5;
      sky.style.transform = "translate(" + (x*-18) + "px," + (y*-18) + "px)";
    });
  }

  /* ---- detail panel ---- */
  function panelHTML(l){
    return '<div class="panel">'
      + '<p>' + esc(l.about) + '</p>'
      + '<dl class="stats">'
      +   '<div class="stat"><dt>Typ</dt><dd title="' + esc(l.type) + '">' + esc(l.type) + '</dd></div>'
      +   '<div class="stat"><dt>Frekvence</dt><dd title="' + esc(l.cadence) + '">' + esc(l.cadence) + '</dd></div>'
      +   '<div class="stat"><dt>Doména</dt><dd title="' + esc(domain(l.url)) + '">' + esc(domain(l.url)) + '</dd></div>'
      + '</dl>'
      + '<div class="tags">'
      +   l.tags.map(function(t){ return '<span class="tag">#' + esc(t) + '</span>'; }).join("")
      +   '<button type="button" class="copy" data-copy="' + esc(l.url) + '">Kopírovat odkaz</button>'
      + '</div>'
      + '</div>';
  }

  /* ---- hlavní tlačítka ---- */
  var featured = LINKS.filter(function(l){ return l.featured; });
  var rest = LINKS.filter(function(l){ return !l.featured; });
  document.getElementById("count").textContent = LINKS.length + " odkazů";

  var feat = document.getElementById("featured");
  feat.innerHTML = featured.map(function(l){
    return '<div class="card" data-tilt>'
      + '<div class="row">'
      +   '<a class="main" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">'
      +     '<span class="badge">' + l.icon + '</span>'
      +     '<span style="min-width:0">'
      +       '<span class="title">' + esc(l.name)
      +         (l.live ? '<span class="live"><i></i> Live</span>' : '')
      +       '</span>'
      +       '<span class="sub">' + esc(l.sub) + ' &middot; <b>' + esc(l.handle) + '</b></span>'
      +     '</span>'
      +   '</a>'
      +   '<button type="button" class="info" aria-expanded="false" aria-label="Detaily ' + esc(l.name) + '" data-toggle="' + esc(l.id) + '">i</button>'
      + '</div>'
      + '<div id="panel-' + esc(l.id) + '" hidden>' + panelHTML(l) + '</div>'
      + '</div>';
  }).join("");

  feat.addEventListener("click", function(e){
    var btn = e.target.closest("[data-toggle]");
    if (btn){
      var box = document.getElementById("panel-" + btn.getAttribute("data-toggle"));
      var open = box.hasAttribute("hidden");
      if (open){ box.removeAttribute("hidden"); } else { box.setAttribute("hidden",""); }
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      btn.textContent = open ? "\u2212" : "i";
      return;
    }
    var cp = e.target.closest("[data-copy]");
    if (cp){
      var url = cp.getAttribute("data-copy");
      var done = function(){ cp.textContent = "Zkopírováno \u2713"; setTimeout(function(){ cp.textContent = "Kopírovat odkaz"; }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(done, done);
      } else {
        var ta = document.createElement("textarea");
        ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch(err){}
        document.body.removeChild(ta); done();
      }
    }
  });

  /* ---- náklon karet ---- */
  if (!reduce){
    Array.prototype.forEach.call(document.querySelectorAll("[data-tilt]"), function(card){
      card.addEventListener("mousemove", function(e){
        var r = card.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width - 0.5;
        var y = (e.clientY - r.top) / r.height - 0.5;
        card.style.transform = "perspective(700px) rotateX(" + (-y*6) + "deg) rotateY(" + (x*8) + "deg)";
      });
      card.addEventListener("mouseleave", function(){ card.style.transform = ""; });
    });
  }

  /* ---- malé ikony + panel pod nimi ---- */
  var icons = document.getElementById("icons");
  var peek = document.getElementById("peek");
  icons.innerHTML = rest.map(function(l){
    return '<a class="ico" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc(l.name) + '" data-id="' + esc(l.id) + '">' + l.icon + '</a>';
  }).join("");

  function show(l){
    Array.prototype.forEach.call(icons.children, function(a){
      a.classList.toggle("on", a.getAttribute("data-id") === l.id);
    });
    peek.innerHTML = '<div class="head"><span class="name">' + esc(l.name) + '</span><span class="h">' + esc(l.handle) + '</span></div>' + panelHTML(l);
  }
  function hide(){
    Array.prototype.forEach.call(icons.children, function(a){ a.classList.remove("on"); });
    peek.innerHTML = '<p class="empty">Najeď na ikonu pro detaily odkazu &#10022;</p>';
  }
  icons.addEventListener("mouseover", function(e){
    var a = e.target.closest("[data-id]");
    if (a){ var l = LINKS.filter(function(x){ return x.id === a.getAttribute("data-id"); })[0]; if (l) show(l); }
  });
  icons.addEventListener("focusin", function(e){
    var a = e.target.closest("[data-id]");
    if (a){ var l = LINKS.filter(function(x){ return x.id === a.getAttribute("data-id"); })[0]; if (l) show(l); }
  });
  icons.addEventListener("mouseleave", hide);
  peek.addEventListener("click", function(e){
    var cp = e.target.closest("[data-copy]");
    if (!cp) return;
    var url = cp.getAttribute("data-copy");
    var done = function(){ cp.textContent = "Zkopírováno \u2713"; setTimeout(function(){ cp.textContent = "Kopírovat odkaz"; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done, done); }
    else { done(); }
  });
})();
</script>
</body>
</html>
