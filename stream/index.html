<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stream Live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23E0102B'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%23FFC629'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ============ DESIGN TOKENS ============
     --red     : dominant header / action color
     --red-dk  : darker shade for depth / hover
     --gold    : energetic accent (underline, hover, live dot)
     --ink     : near-black backdrop behind the player
     --ink-2   : one step lighter panel
     --paper   : white text
     --mute    : muted grey text
     --online  : green for "online" status
  ============================================= */
  :root{
    --red:#E0102B;
    --red-dk:#9E0C20;
    --gold:#FFC629;
    --ink:#141110;
    --ink-2:#1E1A18;
    --paper:#FFFAF2;
    --mute:#B9AFA7;
    --online:#2ECC71;
    --radius:14px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  h1,h2{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.5px;margin:0;}
  button,a.btn{font-family:'Inter',system-ui,sans-serif;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:relative;
    background:linear-gradient(180deg,var(--red) 0%,var(--red-dk) 100%);
    padding:16px clamp(16px,4vw,40px) 26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    box-shadow:0 6px 0 rgba(0,0,0,.18);
  }
  .topbar::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-10px;
    height:10px;
    background:var(--red-dk);
    clip-path:polygon(0 0,100% 60%,100% 100%,0 100%);
  }
  .topbar-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}

  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(0,0,0,.22);
    color:var(--paper);
    text-decoration:none;
    border:1px solid rgba(255,255,255,.3);
    border-radius:999px;
    padding:6px 13px;
    font-size:.85rem;
    font-weight:600;
    flex:0 0 auto;
    transition:background .15s ease, transform .15s ease;
  }
  .back-btn:hover{background:rgba(0,0,0,.35);transform:translateY(-1px);}

  .live-badge{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--ink);
    color:var(--paper);
    font-family:'Anton',sans-serif;
    font-size:.85rem;
    letter-spacing:1.5px;
    padding:6px 12px 6px 10px;
    border-radius:999px;
    flex:0 0 auto;
  }
  .live-badge .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 0 rgba(255,198,41,.6);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,198,41,.55);}
    70%{box-shadow:0 0 0 9px rgba(255,198,41,0);}
    100%{box-shadow:0 0 0 0 rgba(255,198,41,0);}
  }
  .stream-title{
    font-size:clamp(1.3rem,3vw,2.1rem);
    color:var(--paper);
    text-shadow:0 2px 0 rgba(0,0,0,.2);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:50vw;
  }

  .discord-btn{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--ink);
    color:var(--paper);
    border:2px solid var(--gold);
    border-radius:999px;
    padding:9px 18px;
    cursor:pointer;
    font-weight:700;
    font-size:.95rem;
    transition:transform .15s ease, background .15s ease;
    flex:0 0 auto;
  }
  .discord-btn:hover{background:#2A2320;transform:translateY(-2px);}
  .discord-btn:active{transform:translateY(0);}
  .discord-btn svg{width:20px;height:20px;flex:0 0 auto;}
  .discord-count{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.08);
    padding:3px 10px;
    border-radius:999px;
    font-size:.82rem;
    color:var(--mute);
  }
  .discord-count .dot{width:7px;height:7px;border-radius:50%;background:var(--online);flex:0 0 auto;}
  .discord-count.is-loading .dot{background:var(--mute);}

  /* ---------- STAGE ---------- */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(16px,3vw,32px);
    gap:16px;
    width:100%;
  }
  .player-wrap{
    position:relative;
    width:100%;
    max-width:1400px;
    aspect-ratio:16/9;
    background:#000;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
  }
  .player-wrap iframe{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:0;
    display:block;
  }

  .loader{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;
    background:var(--ink-2);
    z-index:3;
    transition:opacity .35s ease;
  }
  .loader.hide{opacity:0;pointer-events:none;}
  .loader-bar{
    width:120px;height:6px;border-radius:999px;
    background:rgba(255,255,255,.12);
    overflow:hidden;
  }
  .loader-bar::after{
    content:"";display:block;height:100%;width:40%;
    background:linear-gradient(90deg,var(--red),var(--gold));
    border-radius:999px;
    animation:load 1.1s ease-in-out infinite;
  }
  @keyframes load{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(280%);}
  }
  .loader p{margin:0;color:var(--mute);font-size:.9rem;}

  .player-error{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:20px;
    background:var(--ink-2);
    z-index:3;
  }
  .player-error p{margin:0;color:var(--mute);max-width:320px;}

  .sound-overlay{
    position:absolute;
    bottom:16px;left:16px;
    z-index:4;
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(20,17,16,.85);
    color:var(--paper);
    border:1px solid var(--gold);
    border-radius:999px;
    padding:9px 16px;
    cursor:pointer;
    font-weight:700;
    font-size:.88rem;
    backdrop-filter:blur(4px);
    transition:opacity .2s ease, transform .15s ease;
  }
  .sound-overlay:hover{transform:translateY(-1px);}
  .sound-overlay.hidden{opacity:0;pointer-events:none;}

  /* ---------- CONTROLS ---------- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    width:100%;
    max-width:1400px;
  }
  .ctrl-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--ink-2);
    color:var(--paper);
    border:1px solid rgba(255,255,255,.12);
    padding:11px 18px;
    border-radius:999px;
    cursor:pointer;
    font-weight:600;
    font-size:.92rem;
    transition:border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .ctrl-btn:hover{border-color:var(--gold);transform:translateY(-1px);}
  .ctrl-btn:active{transform:translateY(0);}
  .ctrl-btn.is-active{background:var(--red);border-color:var(--red);}

  /* ---------- CINEMA MODE ---------- */
  body.cinema .topbar,
  body.cinema .controls{
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  body.cinema .stage{padding:0;}
  body.cinema .player-wrap{
    max-width:none;
    width:100vw;
    height:100vh;
    aspect-ratio:auto;
    border-radius:0;
  }
  .exit-cinema{
    position:fixed;
    top:16px;right:16px;
    z-index:20;
    display:none;
    background:rgba(20,17,16,.75);
    color:var(--paper);
    border:1px solid rgba(255,255,255,.25);
    border-radius:999px;
    padding:9px 16px;
    cursor:pointer;
    font-weight:600;
    backdrop-filter:blur(4px);
  }
  body.cinema .exit-cinema{display:inline-flex;align-items:center;gap:6px;}

  footer{
    text-align:center;
    color:var(--mute);
    font-size:.8rem;
    padding:14px;
  }
  footer a{color:var(--mute);}
  body.cinema footer{display:none;}

  @media (max-width:640px){
    .topbar{padding:14px 16px 22px;}
    .stream-title{max-width:100%;white-space:normal;}
    .discord-text{display:none;}
    .ctrl-btn{flex:1 1 calc(50% - 10px);justify-content:center;}
  }
  @media (prefers-reduced-motion:reduce){
    .live-badge .dot,.loader-bar::after{animation:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a class="back-btn" id="backBtn" href="#">← Server</a>
    <span class="live-badge"><span class="dot"></span>LIVE</span>
    <h1 class="stream-title" id="streamTitle">STREAM TITLE</h1>
  </div>

  <button class="discord-btn" id="discordBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M8 10.5c1.2 1.4 2.6 2.2 4 2.2s2.8-.8 4-2.2M9 15.5c1 .5 2 .8 3 .8s2-.3 3-.8M6 6.5C9 5 15 5 18 6.5c1.6 2.4 2.3 5.6 2 9-2 1.6-4 2.3-5 2.5l-1-2M6 6.5C4.4 8.9 3.7 12.1 4 15.5c2 1.6 4 2.3 5 2.5l1-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="discord-text">Discord</span>
    <span class="discord-count is-loading" id="discordCount"><span class="dot"></span><span id="discordCountText">…</span></span>
  </button>
</header>

<main class="stage">
  <div class="player-wrap" id="playerWrap">
    <div class="loader" id="loader">
      <div class="loader-bar"></div>
      <p>Loading stream…</p>
    </div>
    <div class="player-error" id="playerError" hidden>
      <p>The player failed to load. Check your connection or try again.</p>
      <button class="ctrl-btn" id="retryBtn" type="button">Try again</button>
    </div>
    <iframe
      id="kickPlayer"
      title="Kick stream"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media; web-share"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
    <button class="sound-overlay" id="soundOverlay" type="button">🔇 Tap for sound</button>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="fullscreenBtn" type="button">⛶ Fullscreen</button>
    <button class="ctrl-btn" id="cinemaBtn" type="button">🎬 Cinema mode</button>
    <button class="ctrl-btn" id="chatBtn" type="button">💬 Open chat</button>
    <button class="ctrl-btn" id="reloadBtn" type="button">🔄 Reload stream</button>
  </div>
</main>

<button class="exit-cinema" id="exitCinema" type="button">✕ Exit cinema mode</button>

<footer>Unofficial viewing page — Kick and Discord are the property of their respective owners.</footer>

<script>
(function(){
  "use strict";

  /* ================= CONFIG — EDIT THIS ================= */
  const CONFIG = {
    // Kick username exactly as it appears in kick.com/USERNAME
    kickChannel: "zlatorsipofcola",
    // just the code from discord.gg/CODE (not the full URL)
    discordInviteCode: "EQNjkvTpPs",
    // text shown in the header
    streamTitle: "SIP OF COLA IS BACK!",
    // where "← Server" should link back to
    serverHomeUrl: "https://siphcf.eu",
    // how often (ms) to refresh the Discord online count
    discordRefreshMs: 60000,
    // how long (ms) to wait before showing a player error
    playerTimeoutMs: 15000
  };
  /* ========================================================= */

  const $ = (id) => document.getElementById(id);
  const iframe = $("kickPlayer");
  const loader = $("loader");
  const playerError = $("playerError");
  const playerErrorText = playerError.querySelector("p");
  const streamTitleEl = $("streamTitle");
  document.title = CONFIG.streamTitle + " — Live";
  streamTitleEl.textContent = CONFIG.streamTitle;
  $("backBtn").href = CONFIG.serverHomeUrl;

  let playerTimeout = null;
  let muted = true; // start muted: the only way autoplay is reliably allowed by browsers

  function showPlayerError(message = "The player failed to load. Check your connection or try again."){
    loader.classList.add("hide");
    playerErrorText.textContent = message;
    playerError.hidden = false;
  }

  function kickSrc(){
    return "https://player.kick.com/" + encodeURIComponent(CONFIG.kickChannel) +
      "?autoplay=true&muted=" + (muted ? "true" : "false");
  }

  async function fetchChannelStatus(){
    try {
      const res = await fetch(
        "https://kick.com/api/v2/channels/" + encodeURIComponent(CONFIG.kickChannel),
        { cache: "no-store" }
      );
      if (!res.ok) return null;

      const data = await res.json();
      return data && data.livestream ? "live" : "offline";
    } catch (err) {
      return null;
    }
  }

  async function loadPlayer(){
    playerError.hidden = true;
    loader.classList.remove("hide");
    clearTimeout(playerTimeout);

    const channelStatus = await fetchChannelStatus();
    if (channelStatus === "offline") {
      iframe.removeAttribute("src");
      showPlayerError("This stream is currently offline. Check back later.");
      return;
    }

    iframe.src = kickSrc();
    playerTimeout = setTimeout(() => {
      // Player never finished loading (e.g. network issue) — surface a clear retry action
      showPlayerError();
    }, CONFIG.playerTimeoutMs);
  }

  iframe.addEventListener("load", () => {
    clearTimeout(playerTimeout);
    loader.classList.add("hide");
    playerError.hidden = true;
  });

  $("retryBtn").addEventListener("click", loadPlayer);
  $("reloadBtn").addEventListener("click", loadPlayer);

  /* ---------- SOUND ---------- */
  // Kick's embed only exposes mute as a URL param, so turning sound on
  // reloads the iframe — but only after a real click, which browsers allow.
  const soundOverlay = $("soundOverlay");
  soundOverlay.addEventListener("click", () => {
    muted = false;
    soundOverlay.classList.add("hidden");
    loadPlayer();
  });

  /* ---------- CHAT ---------- */
  // Kick doesn't officially support embedding chat in an iframe (it's
  // usually blocked), so this opens the real chat page in its own window —
  // that always works, an iframe here would just risk a blank box.
  $("chatBtn").addEventListener("click", () => {
    const url = "https://kick.com/popout/" + encodeURIComponent(CONFIG.kickChannel) + "/chat";
    window.open(url, "kick-chat", "width=420,height=760,noopener,noreferrer");
  });

  /* ---------- FULLSCREEN ---------- */
  const playerWrap = $("playerWrap");
  const fullscreenBtn = $("fullscreenBtn");

  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  fullscreenBtn.addEventListener("click", () => {
    if (!isFullscreen()){
      const req = playerWrap.requestFullscreen || playerWrap.webkitRequestFullscreen;
      if (req) req.call(playerWrap);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  });
  document.addEventListener("fullscreenchange", updateFullscreenLabel);
  document.addEventListener("webkitfullscreenchange", updateFullscreenLabel);
  function updateFullscreenLabel(){
    fullscreenBtn.textContent = isFullscreen() ? "⛶ Exit fullscreen" : "⛶ Fullscreen";
    fullscreenBtn.classList.toggle("is-active", isFullscreen());
  }

  /* ---------- CINEMA MODE ---------- */
  const cinemaBtn = $("cinemaBtn");
  function setCinema(on){
    document.body.classList.toggle("cinema", on);
    cinemaBtn.classList.toggle("is-active", on);
  }
  cinemaBtn.addEventListener("click", () => setCinema(!document.body.classList.contains("cinema")));
  $("exitCinema").addEventListener("click", () => setCinema(false));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.body.classList.contains("cinema")) setCinema(false);
  });

  /* ---------- DISCORD ---------- */
  const discordCount = $("discordCount");
  const discordCountText = $("discordCountText");

  $("discordBtn").addEventListener("click", () => {
    window.open("https://discord.gg/" + encodeURIComponent(CONFIG.discordInviteCode), "_blank", "noopener,noreferrer");
  });

  async function refreshDiscordCount(){
    try {
      const res = await fetch(
        "https://discord.com/api/v10/invites/" + encodeURIComponent(CONFIG.discordInviteCode) + "?with_counts=true",
        { cache: "no-store" }
      );
      if (!res.ok) throw new Error("bad status " + res.status);
      const data = await res.json();
      if (typeof data.approximate_presence_count === "number"){
        discordCountText.textContent = data.approximate_presence_count + " online";
        discordCount.classList.remove("is-loading");
        return;
      }
      throw new Error("missing counts");
    } catch (err){
      // API failed / CORS / invalid code — the button still works, we just
      // hide the live number so the page never looks broken.
      discordCountText.textContent = "Join";
      discordCount.classList.remove("is-loading");
    }
  }

  refreshDiscordCount();
  setInterval(refreshDiscordCount, CONFIG.discordRefreshMs);

  /* ---------- START ---------- */
  loadPlayer();
})();
</script>
</body>
</html>
