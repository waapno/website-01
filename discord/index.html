<!DOCTYPE html>
<html lang="cs" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-title">SIP's Network — Official Discord</title>
    
    <!-- Automatické přesměrování -->
    <meta http-equiv="refresh" content="3;url=https://discord.gg/EQNjkvTpPs">

    <!-- DISCORD & OPEN GRAPH EMBED META TAGY -->
    <meta property="og:type" content="website">
    <meta id="og-title" property="og:title" content="SIP's Network — Official Community Hub">
    <meta id="og-desc" property="og:description" content="Join the official SIP's Network Discord community! HCF & Factions events, latest news, and active player base.">
    <meta property="og:url" content="https://discord.siphcf.eu">
    <meta property="og:image" content="https://siphcf.eu/assets/banner.png">
    <meta name="theme-color" content="#6366f1">

    <!-- TWITTER CARD METADATA -->
    <meta name="twitter:card" content="summary_large_image">
    <meta id="tw-title" name="twitter:title" content="SIP's Network — Official Discord">
    <meta id="tw-desc" name="twitter:description" content="Join the official SIP's Network Discord server!">
    <meta name="twitter:image" content="https://siphcf.eu/assets/banner.png">

    <!-- PRESTIGE TYPOGRAPHY (Inter & Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #06080d;
            --card-bg: rgba(13, 17, 28, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --accent-hover: #4f46e5;
            --text-heading: #f8fafc;
            --text-body: #94a3b8;
            --badge-bg: rgba(99, 102, 241, 0.12);
            --badge-border: rgba(99, 102, 241, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-heading);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* AMBIENT BACKGROUND GLOWS */
        .ambient-glow-1 {
            position: absolute;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            top: -15%;
            left: -10%;
            filter: blur(80px);
            opacity: 0.6;
            z-index: 0;
            animation: floatGlow 12s infinite alternate ease-in-out;
        }

        .ambient-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, rgba(0,0,0,0) 70%);
            bottom: -15%;
            right: -10%;
            filter: blur(90px);
            opacity: 0.5;
            z-index: 0;
            animation: floatGlow 10s infinite alternate-reverse ease-in-out;
        }

        /* MAIN CARD */
        .card-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 460px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 28px;
            padding: 3.25rem 2.5rem 2.5rem;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.65),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* LOCATION BADGE */
        .loc-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #c7d2fe;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
        }

        .loc-badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        /* ICON WRAPPER */
        .icon-box {
            position: relative;
            width: 88px;
            height: 88px;
            margin: 0 auto 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-aura {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-primary), #a855f7);
            border-radius: 24px;
            opacity: 0.25;
            filter: blur(12px);
            animation: pulseAura 3s infinite ease-in-out;
        }

        .icon-inner {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .discord-svg {
            width: 44px;
            height: 44px;
            fill: #ffffff;
            filter: drop-shadow(0 4px 10px rgba(99, 102, 241, 0.5));
        }

        /* TEXT TYPOGRAPHY */
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 0.6rem;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            color: var(--text-body);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 2.25rem;
            font-weight: 400;
        }

        /* PROGRESS LOADER */
        .progress-wrapper {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), #a855f7);
            border-radius: 10px;
            animation: fillProgress 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-shadow: 0 0 14px var(--accent-primary);
        }

        /* BUTTON */
        .btn-redirect {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 1rem 1.75rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 25px var(--accent-glow);
        }

        .btn-redirect:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 15px 35px var(--accent-glow);
            filter: brightness(1.1);
        }

        .btn-redirect svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.25s ease;
        }

        .btn-redirect:hover svg {
            transform: translateX(4px);
        }

        /* KEYFRAME ANIMATIONS */
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseAura {
            0%, 100% { opacity: 0.25; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(1.08); }
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 20px); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="card-container">
        <!-- Location Badge -->
        <div class="loc-badge">
            <span class="loc-badge-dot"></span>
            <span id="txt-location">Detecting region...</span>
        </div>

        <!-- Discord Prestige Icon -->
        <div class="icon-box">
            <div class="icon-aura"></div>
            <div class="icon-inner">
                <svg class="discord-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127.14 96.36">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0,-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.95-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.87,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.92,96.1,53,91.08,65.69,84.69,65.69Z"/>
                </svg>
            </div>
        </div>

        <!-- Dynamic Content -->
        <h1 id="txt-title">SIP's Network</h1>
        <p class="description" id="txt-desc">Redirecting you to our official community hub...</p>

        <!-- Progress Bar -->
        <div class="progress-wrapper">
            <div class="progress-bar"></div>
        </div>

        <!-- Manual Redirect Button -->
        <a href="https://discord.gg/EQNjkvTpPs" class="btn-redirect" id="btn-text">
            <span>Join Directly</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>
    </div>

    <!-- LOCALIZATION & VARIABLE ENGINE -->
    <script>
        const DISCORD_URL = "https://discord.gg/EQNjkvTpPs";

        // Slovník jazyků podle lokalit
        const i18n = {
            cs: {
                locationBadge: "Region: Česko / Slovensko",
                title: "Připojování k SIP's Network",
                desc: "Za malý moment tě automaticky přesměrujeme na náš oficiální Discord server.",
                btn: "Vstoupit ihned",
                ogTitle: "SIP's Network — Oficiální Discord",
                ogDesc: "Připoj se k oficiálnímu Discordu SIP's Network! HCF/Factions eventy, novinky a komunitní podpora."
            },
            en: {
                locationBadge: "Region: International",
                title: "Joining SIP's Network",
                desc: "You will be redirected to our official Discord community hub in just a moment.",
                btn: "Join Directly",
                ogTitle: "SIP's Network — Official Discord",
                ogDesc: "Join the official SIP's Network Discord server! HCF & Factions events, announcements, and active support."
            }
        };

        // Detekce jazyka / lokality uživatele
        function detectUserLanguage() {
            const userLang = (navigator.language || navigator.userLanguage || "").toLowerCase();
            return (userLang.startsWith("cs") || userLang.startsWith("sk")) ? "cs" : "en";
        }

        // Aplikace lokalizace do DOM
        function applyLocalization() {
            const lang = detectUserLanguage();
            const data = i18n[lang];

            // Úprava HTML prvků na stránce
            document.getElementById("html-root").lang = lang;
            document.getElementById("txt-location").innerText = data.locationBadge;
            document.getElementById("txt-title").innerText = data.title;
            document.getElementById("txt-desc").innerText = data.desc;
            document.querySelector("#btn-text span").innerText = data.btn;

            // Dynamická úprava Meta tagů pro OpenGraph / Discord Embedy
            document.getElementById("meta-title").innerText = data.ogTitle;
            document.getElementById("og-title").setAttribute("content", data.ogTitle);
            document.getElementById("og-desc").setAttribute("content", data.ogDesc);
            document.getElementById("tw-title").setAttribute("content", data.ogTitle);
            document.getElementById("tw-desc").setAttribute("content", data.ogDesc);
        }

        // Spuštění při načtení
        applyLocalization();

        // Bezpečné přesměrování
        setTimeout(() => {
            window.location.href = DISCORD_URL;
        }, 2800);
    </script>
</body>
</html>
